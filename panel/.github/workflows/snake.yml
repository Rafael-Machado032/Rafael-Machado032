name: Generate Snake

on:
  schedule:
    # Executa automaticamente a cada 12 horas
    - cron: "0 */12 * * *"
  
  # Permite que você execute manualmente o script se quiser testar
  workflow_dispatch:
  
  # Executa toda vez que você atualiza o seu repositório principal
  push:
    branches:
    - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Gera o jogo baseado no seu histórico de contribuições
      - name: generate-github-contribution-grid-snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Rafael-Machado032
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      # Envia os arquivos gerados para uma branch oculta chamada "output"
      - name: push github-contribution-grid-snake to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
